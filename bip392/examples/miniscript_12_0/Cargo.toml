[package]
name = "bip392-example-miniscript-12-0"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: a directory under a workspace member cannot be excluded.
[workspace]

# Pinned to the oldest supported release, the floor bip392 declares.
[dependencies]
miniscript = "=12.0.0"
bip392 = { path = "../..", default-features = false, features = ["miniscript_12"] }

[[bin]]
name = "roundtrip"
path = "../shared/roundtrip.rs"
